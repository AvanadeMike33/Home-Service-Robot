use_map_topic: true
first_map_only: false

odom_frame_id: odom
base_frame_id: robot_footprint
global_frame_id: map
tf_broadcast: true
transform_tolerance: 0.5

min_particles: 500
max_particles: 2000
kld_err: 0.02
kld_z: 0.99
resample_interval: 1

update_min_d: 0.10
update_min_a: 0.10
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.10

laser_model_type: likelihood_field
laser_min_range: 0.10
laser_max_range: 30.0
laser_max_beams: 60
laser_z_hit: 0.95
laser_z_rand: 0.05
laser_sigma_hit: 0.20
laser_likelihood_max_dist: 2.0

odom_model_type: diff
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.05
odom_alpha4: 0.05
odom_alpha5: 0.05

gui_publish_rate: 5.0
save_pose_rate: 0.5
