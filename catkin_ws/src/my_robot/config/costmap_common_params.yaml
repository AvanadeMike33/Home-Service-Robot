map_type: costmap
transform_tolerance: 0.5

# Real envelope: 0.60 m chassis length and about 0.35 m across the wheels.
footprint:
  - [-0.31, -0.19]
  - [-0.31,  0.19]
  - [ 0.31,  0.19]
  - [ 0.31, -0.19]
footprint_padding: 0.01

obstacle_range: 2.5
raytrace_range: 3.0
inflation_radius: 0.35
cost_scaling_factor: 5.0

observation_sources: laser_scan_sensor
laser_scan_sensor:
  sensor_frame: hokuyo
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true
  observation_persistence: 0.0
  expected_update_rate: 0.0
  inf_is_valid: true
